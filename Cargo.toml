[package]
name = "udp_tunnel"
description = "UDP tunnel with mirroring input traffic to secondary server."
authors = ["Kirill Kuzminykh <cykooz@gmail.com>"]
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/Cykooz/udp_tunnel"
version = "0.1.0"
edition = "2024"


[dependencies]
tokio = { version = "1.49", features = ["rt", "macros", "net", "time", "sync", "signal"] }
anyhow = "1.0"
thiserror = "2.0"
tracing = { version = "0.1", optional = true, default-features = false }
tracing-subscriber = { version = "0.3.22", default-features = false, features = ["fmt", "ansi"], optional = true }
clap = { version = "4.5", features = ["derive"], optional = true }
clap-verbosity-flag = { version = "3.0", default-features = false, features = ["tracing"], optional = true }


[features]
default = ["tracing"]
tracing = ["dep:tracing", "dep:tracing-subscriber", "dep:clap-verbosity-flag"]
clap = ["dep:clap"]


[dev-dependencies]
tokio = { version = "1.49", features = ["test-util"] }


[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
