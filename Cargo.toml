[package]
name = "udp_tunnel"
version = "0.1.0"
edition = "2024"


[dependencies]
tokio = { version = "1.49.0", features = ["rt", "macros", "net", "time", "sync"] }
anyhow = "1.0.101"
thiserror = "2.0.18"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.5", features = ["derive"] }
clap-verbosity-flag = { version = "3.0", default-features = false, features = ["tracing"] }


[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
